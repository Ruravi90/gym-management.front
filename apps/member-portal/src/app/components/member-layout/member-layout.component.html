<div class="dashboard-layout" [class.sidebar-collapsed]="sidebarCollapsed">

  <!-- Mobile hamburger -->
  <button class="menu-toggle mobile-only" (click)="toggleSidebar()"
    [attr.aria-label]="sidebarCollapsed ? 'Abrir menú' : 'Cerrar menú'">
    {{ sidebarCollapsed ? '☰' : '✕' }}
  </button>

  <!-- Mobile backdrop -->
  <div class="sidebar-backdrop" *ngIf="isMobileView && !sidebarCollapsed" (click)="toggleSidebar()"></div>

  <aside class="sidebar-premium" [class.collapsed]="sidebarCollapsed" [class.mobile-view]="isMobileView">
    <!-- Desktop toggle -->
    <button class="menu-toggle desktop-only" (click)="toggleSidebar()"
      [attr.aria-label]="sidebarCollapsed ? 'Abrir menú' : 'Cerrar menú'">
      {{ sidebarCollapsed ? '☰' : '✕' }}
    </button>

    <div class="brand-container">
      <div class="logo-circle">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" class="logo-svg">
          <path d="M2 13h3l2-4 3 8 2-6 2 2h5"/>
        </svg>
      </div>
      <span class="brand-text">PULSE</span>
    </div>

    <nav class="nav-menu">
      <a routerLink="/dashboard" routerLinkActive="active" [routerLinkActiveOptions]="{exact: true}"
        class="nav-item" [title]="sidebarCollapsed ? 'Dashboard' : ''" (click)="onNavItemClick()">
        <svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"></path>
          <polyline points="9 22 9 12 15 12 15 22"></polyline>
        </svg>
        <span class="nav-label">Dashboard</span>
      </a>

      <a routerLink="/my-qr" routerLinkActive="active"
        class="nav-item" [title]="sidebarCollapsed ? 'Mi Código QR' : ''" (click)="onNavItemClick()">
        <svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <rect x="3" y="3" width="7" height="7" rx="1"></rect>
          <rect x="14" y="3" width="7" height="7" rx="1"></rect>
          <rect x="3" y="14" width="7" height="7" rx="1"></rect>
          <rect x="14" y="14" width="7" height="7" rx="1"></rect>
        </svg>
        <span class="nav-label">Mi Código QR</span>
      </a>

      <a routerLink="/mi-progreso" routerLinkActive="active"
        class="nav-item" [title]="sidebarCollapsed ? 'Mi Progreso' : ''" (click)="onNavItemClick()">
        <svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M6 9H4.5a2.5 2.5 0 0 1 0-5C7 4 6 9 6 9z"></path>
          <path d="M18 9h1.5a2.5 2.5 0 0 0 0-5C17 4 18 9 18 9z"></path>
          <path d="M4 22h16"></path>
          <path d="M10 14.66V17c0 .55-.47.98-.97 1.21C7.85 18.75 7 20.24 7 22"></path>
          <path d="M14 14.66V17c0 .55.47.98.97 1.21C16.15 18.75 17 20.24 17 22"></path>
          <path d="M18 2H6v7a6 6 0 0 0 12 0V2Z"></path>
        </svg>
        <span class="nav-label">Mi Progreso</span>
      </a>

      <a routerLink="/mejora-continua" routerLinkActive="active"
        class="nav-item" [title]="sidebarCollapsed ? 'Mejora Continua' : ''" (click)="onNavItemClick()">
        <svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M11 20A7 7 0 0 1 9.8 6.9C15.5 4.9 17 3.5 19 2c1 2 2 4.5 1 8-1 3.5-4.2 6.5-7 9z"></path>
          <path d="M11.7 10.9c.9-1 1.8-1.7 3.3-2.4"></path>
        </svg>
        <span class="nav-label">Mejora Continua</span>
      </a>

      <a routerLink="/rutinas" routerLinkActive="active"
        class="nav-item" [title]="sidebarCollapsed ? 'Rutinas' : ''" (click)="onNavItemClick()">
        <svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M6.5 6.5h11"/><path d="M6.5 17.5h11"/>
          <rect x="2" y="8" width="4" height="8" rx="1"/><rect x="18" y="8" width="4" height="8" rx="1"/>
          <rect x="5" y="10" width="2" height="4" rx="0.5"/><rect x="17" y="10" width="2" height="4" rx="0.5"/>
          <line x1="12" y1="6" x2="12" y2="18"/>
        </svg>
        <span class="nav-label">Rutinas</span>
      </a>

      <div class="nav-divider" *ngIf="!sidebarCollapsed">Membresía</div>

      <a routerLink="/memberships/purchase" routerLinkActive="active"
        class="nav-item" [title]="sidebarCollapsed ? 'Mi Membresía' : ''" (click)="onNavItemClick()">
        <svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <rect x="2" y="5" width="20" height="14" rx="2"></rect>
          <line x1="2" y1="10" x2="22" y2="10"></line>
        </svg>
        <span class="nav-label">Mi Membresía</span>
      </a>
    </nav>

    <div class="sidebar-footer">
      <div class="user-info" *ngIf="!sidebarCollapsed">
        <div class="user-avatar">{{ userName.charAt(0) }}</div>
        <span class="user-name">{{ userName }}</span>
      </div>
      <button class="btn-logout-premium" (click)="logout()"
        [title]="sidebarCollapsed ? 'Cerrar Sesión' : ''">
        <svg class="logout-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"></path>
          <polyline points="16 17 21 12 16 7"></polyline>
          <line x1="21" y1="12" x2="9" y2="12"></line>
        </svg>
        <span class="logout-label">Cerrar Sesión</span>
      </button>
    </div>
  </aside>

  <main class="content-area">
    <router-outlet></router-outlet>
  </main>
</div>

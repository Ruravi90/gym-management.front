<div class="dashboard-layout" [class.sidebar-collapsed]="sidebarCollapsed">

  <!-- Mobile hamburger — fixed outside sidebar -->
  <button class="menu-toggle mobile-only" (click)="toggleSidebar()"
    [attr.aria-label]="sidebarCollapsed ? 'Abrir menú' : 'Cerrar menú'">
    {{ sidebarCollapsed ? '☰' : '✕' }}
  </button>

  <!-- Mobile backdrop -->
  <div class="sidebar-backdrop" *ngIf="isMobileView && !sidebarCollapsed" (click)="toggleSidebar()"></div>

  <aside class="sidebar-premium" [class.collapsed]="sidebarCollapsed" [class.mobile-view]="isMobileView">
    <!-- Desktop/Tablet toggle — inside sidebar, above brand -->
    <button class="menu-toggle desktop-only" (click)="toggleSidebar()"
      [attr.aria-label]="sidebarCollapsed ? 'Abrir menú' : 'Cerrar menú'">
      {{ sidebarCollapsed ? '☰' : '✕' }}
    </button>

    <div class="brand-container">
      <div class="logo-circle">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" class="logo-svg">
          <path d="M2 13h3l2-4 3 8 2-6 2 2h5"/>
        </svg>
      </div>
      <span class="brand-text" *ngIf="!sidebarCollapsed">{{ getCurrentUser()?.tenant_name || 'MyGym' }}</span>
    </div>

    <nav class="nav-menu">
      <a routerLink="/dashboard" routerLinkActive="active" class="nav-item"
        [title]="sidebarCollapsed ? 'Estadísticas' : ''" (click)="onNavItemClick()">
        <svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="7" height="9"></rect><rect x="14" y="3" width="7" height="5"></rect><rect x="14" y="12" width="7" height="9"></rect><rect x="3" y="16" width="7" height="5"></rect></svg>
        <span class="nav-label" *ngIf="!sidebarCollapsed">Estadísticas</span>
      </a>

      <!-- Centro de Control SaaS: solo super_admin -->
      <a routerLink="/platform" routerLinkActive="active" class="nav-item"
        *ngIf="getCurrentUser()?.role === 'super_admin'"
        [title]="sidebarCollapsed ? 'Centro de Control SaaS' : ''" (click)="onNavItemClick()">
        <span class="nav-icon">◈</span>
        <span class="nav-label" *ngIf="!sidebarCollapsed">Centro de Control SaaS</span>
      </a>

      <a routerLink="/clients" routerLinkActive="active" class="nav-item" [title]="sidebarCollapsed ? 'Socios' : ''"
        (click)="onNavItemClick()">
        <svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"></path><circle cx="9" cy="7" r="4"></circle><path d="M23 21v-2a4 4 0 0 0-3-3.87"></path><path d="M16 3.13a4 4 0 0 1 0 7.75"></path></svg>
        <span class="nav-label" *ngIf="!sidebarCollapsed">Socios</span>
      </a>

      <!-- Rutinas: admin, super_admin, manager -->
      <a routerLink="/routines" routerLinkActive="active" class="nav-item" [title]="sidebarCollapsed ? 'Rutinas' : ''"
        *ngIf="getCurrentUser()?.role === 'admin' || getCurrentUser()?.role === 'super_admin' || getCurrentUser()?.role === 'manager'"
        (click)="onNavItemClick()">
        <svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M16 4h2a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2h2"/><rect x="8" y="2" width="8" height="4" rx="1"/><path d="M9 14l2 2 4-4"/></svg>
        <span class="nav-label" *ngIf="!sidebarCollapsed">Rutinas</span>
      </a>

      <!-- Ejercicios: admin, super_admin, manager -->
      <a routerLink="/exercises" routerLinkActive="active" class="nav-item" [title]="sidebarCollapsed ? 'Ejercicios' : ''"
        *ngIf="getCurrentUser()?.role === 'admin' || getCurrentUser()?.role === 'super_admin' || getCurrentUser()?.role === 'manager'"
        (click)="onNavItemClick()">
        <svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M6.5 6.5h11"/><path d="M6.5 17.5h11"/><rect x="2" y="8" width="4" height="8" rx="1"/><rect x="18" y="8" width="4" height="8" rx="1"/><rect x="5" y="10" width="2" height="4" rx="0.5"/><rect x="17" y="10" width="2" height="4" rx="0.5"/><line x1="12" y1="6" x2="12" y2="18"/></svg>
        <span class="nav-label" *ngIf="!sidebarCollapsed">Ejercicios</span>
      </a>

      <!-- Medidas: admin, super_admin, manager -->
      <a routerLink="/measurements" routerLinkActive="active" class="nav-item" [title]="sidebarCollapsed ? 'Medidas' : ''"
        *ngIf="getCurrentUser()?.role === 'admin' || getCurrentUser()?.role === 'super_admin' || getCurrentUser()?.role === 'manager'"
        (click)="onNavItemClick()">
        <svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 3v18h18"></path><path d="M7 16l4-8 4 4 4-6"></path></svg>
        <span class="nav-label" *ngIf="!sidebarCollapsed">Medidas</span>
      </a>

      <!-- Usuarios: admin, super_admin, receptionist -->
      <a routerLink="/admin/users" routerLinkActive="active" class="nav-item"
        *ngIf="getCurrentUser()?.role === 'admin' || getCurrentUser()?.role === 'super_admin' || getCurrentUser()?.role === 'receptionist'"
        [title]="sidebarCollapsed ? 'Usuarios' : ''" (click)="onNavItemClick()">
        <svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path><circle cx="12" cy="7" r="4"></circle></svg>
        <span class="nav-label" *ngIf="!sidebarCollapsed">Usuarios</span>
      </a>

      <!-- Tipos de Membresía: admin, super_admin, manager -->
      <a routerLink="/membership-types" routerLinkActive="active" class="nav-item"
        *ngIf="getCurrentUser()?.role === 'admin' || getCurrentUser()?.role === 'super_admin' || getCurrentUser()?.role === 'manager'"
        [title]="sidebarCollapsed ? 'Tipos de Membresía' : ''" (click)="onNavItemClick()">
        <svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="5" width="20" height="14" rx="2"></rect><line x1="2" y1="10" x2="22" y2="10"></line></svg>
        <span class="nav-label" *ngIf="!sidebarCollapsed">Tipos de Membresía</span>
      </a>

      <div class="nav-divider" *ngIf="!sidebarCollapsed">Centro de Control</div>

      <!-- Check-in: todos los roles -->
      <a routerLink="/checkin" class="nav-item" [title]="sidebarCollapsed ? 'Check-in QR' : ''"
        (click)="onNavItemClick()">
        <svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="7" height="7" rx="1"></rect><rect x="14" y="3" width="7" height="7" rx="1"></rect><rect x="3" y="14" width="7" height="7" rx="1"></rect><rect x="14" y="14" width="7" height="7" rx="1"></rect></svg>
        <span class="nav-label" *ngIf="!sidebarCollapsed">Check-in QR</span>
      </a>
    </nav>

    <div class="sidebar-footer">
      <div class="status-indicator" *ngIf="!sidebarCollapsed">
        <span class="status-dot">●</span> Sistema Activo
        <small class="version-text" *ngIf="versionService.currentVersion">v{{ versionService.currentVersion }}</small>
      </div>
      <button class="btn-logout-premium" (click)="logout()" [title]="sidebarCollapsed ? 'Cerrar Sesión' : ''">
        <svg class="logout-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"></path><polyline points="16 17 21 12 16 7"></polyline><line x1="21" y1="12" x2="9" y2="12"></line></svg>
        <span class="logout-label" *ngIf="!sidebarCollapsed">Cerrar Sesión</span>
      </button>
    </div>
  </aside>

  <main class="content-area">
    <router-outlet></router-outlet>
  </main>
</div>

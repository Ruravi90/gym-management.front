<div class="platform-shell">
  <button class="platform-menu-toggle" type="button" aria-label="Abrir menú" (click)="toggleSidebar()">☰</button>
  <div class="platform-backdrop" *ngIf="sidebarOpen" (click)="closeSidebar()"></div>
  <aside class="platform-sidebar" [class.open]="sidebarOpen">
    <a routerLink="/platform/dashboard" class="platform-brand">
      <span class="platform-logo">M</span>
      <span>MyGym <small>Control Center</small></span>
    </a>

    <div class="platform-label">Administración SaaS</div>
    <nav>
      <a routerLink="/platform/dashboard" routerLinkActive="active" [routerLinkActiveOptions]="{ exact: true }" (click)="closeSidebar()">⌂ <span>Resumen</span></a>
      <a routerLink="/platform/tenants" routerLinkActive="active" (click)="closeSidebar()">▦ <span>Tenants</span></a>
      <a routerLink="/platform/plans" routerLinkActive="active" (click)="closeSidebar()">◈ <span>Planes</span></a>
      <a routerLink="/platform/subscriptions" routerLinkActive="active" (click)="closeSidebar()">◫ <span>Suscripciones</span></a>
      <a routerLink="/platform/invoices" routerLinkActive="active" (click)="closeSidebar()">◧ <span>Facturación</span></a>
      <a routerLink="/platform/audit" routerLinkActive="active" (click)="closeSidebar()">◉ <span>Auditoría global</span></a>
      <a class="disabled-link">◌ <span>Consumo y límites</span><em>Próximo</em></a>
    </nav>

    <div class="platform-footer">
      <a routerLink="/dashboard">← Volver al gimnasio</a>
      <button (click)="logout()">Cerrar sesión</button>
    </div>
  </aside>
  <main class="platform-content"><router-outlet></router-outlet></main>
</div>

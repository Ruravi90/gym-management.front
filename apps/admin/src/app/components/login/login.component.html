<div class="login-page">
  <div class="app-card login-card">
    <div class="login-header">
      <div class="logo-box">
        <img src="assets/icons/icon-admin-192.png" alt="MyGym" class="login-logo">
      </div>
      <h1 class="login-title">MyGym</h1>
      <p class="login-subtitle">Ingresa a tu cuenta para continuar</p>
    </div>

    <form (ngSubmit)="login()" #loginForm="ngForm" class="login-form">
      <div class="alert alert-danger" *ngIf="error">
        {{ error }}
      </div>

      <div class="form-group">
        <label>Correo Electrónico</label>
        <input
          type="email"
          [(ngModel)]="email"
          name="email"
          class="app-input"
          placeholder="nombre@ejemplo.com"
          required
          [disabled]="loading"
        />
      </div>

      <div class="form-group">
        <label>Contraseña</label>
        <div class="password-field">
          <input
            [type]="showPassword ? 'text' : 'password'"
            [(ngModel)]="password"
            name="password"
            class="app-input"
            placeholder="••••••••"
            required
            [disabled]="loading"
          />
          <button type="button" class="password-toggle" (click)="showPassword = !showPassword" [attr.aria-label]="showPassword ? 'Ocultar contraseña' : 'Mostrar contraseña'">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path *ngIf="!showPassword" d="M2 12s3.5-6 10-6 10 6 10 6-3.5 6-10 6S2 12 2 12Z"/><circle *ngIf="!showPassword" cx="12" cy="12" r="2.5"/><path *ngIf="showPassword" d="m3 3 18 18M10.6 6.2A10.8 10.8 0 0 1 12 6c6.5 0 10 6 10 6a17.7 17.7 0 0 1-3.2 3.7M6.2 6.2C3.6 7.8 2 12 2 12s3.5 6 10 6c1.8 0 3.3-.4 4.6-1.1"/></svg>
          </button>
        </div>
      </div>

      <button type="submit" class="app-btn app-btn-primary full-width" [disabled]="loading || !loginForm.valid">
        <span *ngIf="loading">Iniciando sesión...</span>
        <span *ngIf="!loading">Iniciar Sesión</span>
      </button>

      <div class="form-footer">
        <a href="#" class="forgot-link">¿Olvidaste tu contraseña?</a>
      </div>
    </form>
  </div>
</div>

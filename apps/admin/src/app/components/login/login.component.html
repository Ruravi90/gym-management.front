<div class="login-page">
  <div class="app-card login-card">
    <div class="login-header">
      <div class="logo-box">
        <img src="assets/icons/icon-admin-192.png" alt="MyGym" class="login-logo">
      </div>
      <h1 class="login-title">MyGym</h1>
      <p class="login-subtitle">Ingresa a tu cuenta para continuar</p>
    </div>

    <form (ngSubmit)="login()" #loginForm="ngForm" class="login-form">
      <div class="alert alert-danger" *ngIf="error">
        {{ error }}
      </div>

      <div class="form-group">
        <label>Correo Electrónico</label>
        <input
          type="email"
          [(ngModel)]="email"
          name="email"
          class="app-input"
          placeholder="nombre@ejemplo.com"
          required
          [disabled]="loading"
        />
      </div>

      <div class="form-group">
        <label>Contraseña</label>
        <div class="password-field">
          <input
            [type]="showPassword ? 'text' : 'password'"
            [(ngModel)]="password"
            name="password"
            class="app-input"
            placeholder="••••••••"
            required
            [disabled]="loading"
          />
          <button type="button" class="password-toggle" (click)="showPassword = !showPassword" [attr.aria-label]="showPassword ? 'Ocultar contraseña' : 'Mostrar contraseña'">
            {{ showPassword ? 'Ocultar' : 'Mostrar' }}
          </button>
        </div>
      </div>

      <button type="submit" class="app-btn app-btn-primary full-width" [disabled]="loading || !loginForm.valid">
        <span *ngIf="loading">Iniciando sesión...</span>
        <span *ngIf="!loading">Iniciar Sesión</span>
      </button>

      <div class="form-footer">
        <a href="#" class="forgot-link">¿Olvidaste tu contraseña?</a>
      </div>
    </form>
  </div>
</div>
